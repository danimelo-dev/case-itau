services:
  funds-api:
    build:
      context: ./Funds.Api
      dockerfile: Dockerfile
    container_name: funds-api
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=funds-sqlserver,1433;Database=FundsDb;User Id=sa;Password=FundsApi@2026;TrustServerCertificate=True"
    depends_on:
      - funds-sqlserver

  funds-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: funds-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FundsApi@2026"
    volumes:
      - funds-sqlserver-data:/var/opt/mssql

volumes:
  funds-sqlserver-data: