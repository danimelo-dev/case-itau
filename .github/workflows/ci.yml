name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test-and-docker:
    name: Build Test and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./Funds.Api.slnx

      - name: Build solution
        run: dotnet build ./Funds.Api.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./Funds.Api.Tests/Funds.Api.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Build Docker image
        run: docker build -t funds-api ./Funds.Api